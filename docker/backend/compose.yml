services:
  mysql:
    image: mysql:8.4
    container_name: portfolio-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    container_name: portfolio-api

    build:
      context: ../..
      dockerfile: docker/backend/api/Dockerfile

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ConnectionStrings__DefaultConnection: Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};

    ports:
      - "5000:5000"

    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: portfolio-phpmyadmin
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}

    ports:
      - "8080:80"

volumes:
  mysql-data: