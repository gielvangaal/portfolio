server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed static assets.
    location /assets/ {
        try_files $uri =404;
    }

    # React Router uses client-side routes such as /portfolio/:slug.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
