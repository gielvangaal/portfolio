name: Scan portfolio container images

on:
  schedule:
    - cron: '19 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    name: Trivy ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, api]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Existing build workflow publishes sha-<commit> image tags from main.
      - name: Scan published main image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/portfolio-${{ matrix.component }}:sha-${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
