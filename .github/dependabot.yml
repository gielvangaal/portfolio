# Security updates only. Routine version-update PRs disabled.
# Enable Dependency graph, Dependabot alerts and Dependabot security updates
# in GitHub Settings > Advanced Security. No automerge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly # Required by schema; does NOT delay security updates
    open-pull-requests-limit: 0 # Only routine version PRs; security PRs unaffected
  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: monthly # Required by schema; does NOT delay security updates
    open-pull-requests-limit: 0 # Only routine version PRs; security PRs unaffected
  - package-ecosystem: docker
    directory: /docker/frontend
    schedule:
      interval: monthly # Required by schema; does NOT delay security updates
    open-pull-requests-limit: 0 # Only routine version PRs; security PRs unaffected
  - package-ecosystem: docker
    directory: /docker/backend/api
    schedule:
      interval: monthly # Required by schema; does NOT delay security updates
    open-pull-requests-limit: 0 # Only routine version PRs; security PRs unaffected
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly # Required by schema; does NOT delay security updates
    open-pull-requests-limit: 0 # Only routine version PRs; security PRs unaffected
